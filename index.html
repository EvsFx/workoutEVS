html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',Inter,Arial,sans-serif;font-variant-numeric:tabular-nums}
::-webkit-scrollbar{display:none}
button{font-family:inherit;color:inherit}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.H{font-family:var(--head);text-transform:uppercase;letter-spacing:.3px}

/* SCREENS & TABS */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);transition:transform .32s cubic-bezier(.4,0,.2,1),opacity .2s}
.screen.hidden{transform:translateX(100%);pointer-events:none}
.screen.off{display:none}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.navpad{height:calc(var(--safe-bot) + 104px)}
.foot{height:calc(var(--safe-bot) + 28px)}

.tabbar{position:fixed;left:12px;right:12px;bottom:calc(var(--safe-bot) + 10px);z-index:120;height:64px;padding:8px;background:var(--surface);border:1px solid var(--border);border-radius:22px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .3s,opacity .3s}
body.in-day .tabbar{transform:translateY(140%);opacity:0;pointer-events:none}
.tab{border:none;background:transparent;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:600;color:var(--muted);cursor:pointer}
.tab svg.i{width:20px;height:20px}
.tab.on{background:var(--accent);color:var(--on-accent);font-weight:800}

/* PAGE HEADER */
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:calc(var(--safe-top) + 18px) 20px 0}
.ph-date{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.ph-t{font-family:var(--head);font-size:34px;font-weight:700;line-height:1;letter-spacing:.3px;text-transform:uppercase}
.gear{width:44px;height:44px;border-radius:14px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.gear svg.i{width:20px;height:20px}

/* TOPBAR (экран тренировки) */
.topbar{display:flex;align-items:center;padding:calc(var(--safe-top) + 8px) 8px 8px;background:var(--bg);border-bottom:1px solid var(--line);flex-shrink:0;gap:4px}
.topbar-title{flex:1;text-align:center;font-family:var(--head);font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;line-height:1.15}
.topbar-title small{display:block;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;text-transform:none;letter-spacing:0;font-size:11px;font-weight:600;color:var(--muted);margin-top:2px}
.ibtn{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:12px;color:var(--text);border:none;background:transparent}
.ibtn:active{background:var(--card)}

.sec{font-size:12px;font-weight:700;color:var(--muted);padding:22px 20px 8px}
.panel{margin:0 16px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:16px}

/* CYCLE */
.cyc{padding:16px 20px 0}
.cyc-segs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.cyc-seg{display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--muted2);font-weight:600}
.cyc-seg i{display:block;height:6px;border-radius:3px;background:var(--border)}
.cyc-seg.past i{background:var(--chart-soft)}
.cyc-seg.now{color:var(--text);font-weight:800}
.cyc-seg.now i{background:var(--accent)}
.cyc-seg.dl.now i{background:var(--deload)}
.cyc-tip{font-size:13px;color:var(--muted);line-height:1.5;margin-top:10px}
.cyc-tip b{color:var(--text)}
.cyc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cyc-title{font-family:var(--head);font-size:22px;font-weight:700;text-transform:uppercase}
.cyc-tag{font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:4px 8px;border-radius:7px;background:var(--accent);color:var(--on-accent);white-space:nowrap}
.cyc-tag.dl{background:var(--deload);color:#fff}

/* NEXT WORKOUT */
.nextc{margin:16px 16px 0;border-radius:24px;background:var(--surface);border:1px solid var(--border);padding:20px;display:flex;flex-direction:column;gap:14px}
.next-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted)}
.nextc h2{font-family:var(--head);font-size:38px;font-weight:700;line-height:.98;text-transform:uppercase}
.next-st{display:flex;gap:20px}
.next-st div{display:flex;flex-direction:column}
.next-st b{font-family:var(--head);font-size:24px;font-weight:600;line-height:1.1}
.next-st span{font-size:11px;color:var(--muted)}
.go{height:56px;border-radius:16px;border:none;background:var(--accent);color:var(--on-accent);font-family:var(--head);font-size:19px;font-weight:700;letter-spacing:1px;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;width:100%}
.go:active{transform:scale(.98)}
.go svg.i{width:18px;height:18px;stroke-width:2.6}

/* DUO TILES */
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 16px 0}
.dt{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left}
.dt:active{transform:scale(.98)}
.dt-l{font-size:12px;font-weight:700;color:var(--muted)}
.dt-v{font-family:var(--head);font-size:28px;font-weight:600;line-height:1}
.dt-v small{font-family:-apple-system,Arial,sans-serif;font-size:13px;font-weight:600;color:var(--muted)}
.dt-s{font-size:11px;color:var(--muted);line-height:1.35}
.dt-a{font-size:11px;font-weight:700;color:var(--accent-ink)}
.segs5{display:flex;gap:4px;margin-top:2px}
.segs5 i{flex:1;height:5px;border-radius:3px;background:var(--border)}
.segs5 i.on{background:var(--accent)}
.remind{margin:12px 16px 0;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--border);font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px;cursor:pointer}
.remind .dot{width:8px;height:8px;border-radius:4px;background:var(--accent);flex-shrink:0}
.light .remind .dot{background:var(--accent-ink)}
.remind .ar{margin-left:auto;color:var(--muted)}

.wk3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:0 20px}
.wk3 div{display:flex;flex-direction:column;gap:2px;padding-left:14px;border-left:1px solid var(--border)}
.wk3 div:first-child{padding-left:0;border-left:none}
.wk3 b{font-family:var(--head);font-size:26px;font-weight:600;line-height:1.1}
.wk3 span{font-size:11px;color:var(--muted)}

.plist{margin:0 20px}
.prow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:none;border-right:none;border-top:none;text-align:left}
.prow:last-child{border-bottom:none}
.prow .n{font-family:var(--head);font-size:21px;font-weight:600;color:var(--muted2);width:28px}
.prow.nx .n{color:var(--accent-ink)}
.prow .t{flex:1;min-width:0}
.prow .t b{display:block;font-size:15px;font-weight:700}
.prow .t span{font-size:12px;color:var(--muted)}
.prow .m{font-size:12px;color:var(--muted2);white-space:nowrap}
.prow .bar{display:block;height:3px;border-radius:2px;background:var(--border);margin-top:6px;overflow:hidden}
.prow .bar i{display:block;height:100%;background:var(--accent)}

/* SETTINGS (в шторке) */
.set-list{background:var(--card);border-radius:16px;overflow:hidden;margin-top:8px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;min-height:52px}
.srow:last-child{border-bottom:none}
.srow span{font-size:15px}
.srow small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.tog{width:50px;height:30px;background:var(--border);border-radius:15px;position:relative;transition:background .2s;flex-shrink:0}
.tog.on{background:var(--accent)}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.tog.on::after{transform:translateX(20px)}
.light .tog.on::after{background:var(--on-accent)}
.wk-chips{display:flex;gap:6px}
.wk-chip{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--text);cursor:pointer}
.wk-chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.wk-chip.dl.on{background:var(--deload);border-color:var(--deload);color:#fff}
.link-row{color:var(--accent-ink);font-weight:600}
.danger{color:var(--bad)}

/* DAY SCREEN */
.phase-bar{margin:12px 14px 2px;border-radius:14px;padding:12px 14px;background:var(--accent-dim);font-size:13px;line-height:1.45}
.phase-bar.dl{background:var(--deload-dim)}
.phase-bar b{font-weight:800}
.ex-list{padding:10px 14px 0}
.excard{background:var(--surface);border:1px solid var(--border);border-radius:20px;margin-bottom:12px;overflow:hidden;transition:border-color .25s}
.excard.done{border-color:var(--accent)}
/* у картинок внизу «вшита» подпись — обрезаем её */
.photo-area{position:relative;width:100%;aspect-ratio:420/203;background:var(--card);overflow:hidden;display:flex;align-items:center;justify-content:center}
.photo-area img{position:absolute;top:0;left:0;width:100%;height:auto;display:block}
.photo-area .offline-card{display:none;width:100%;height:100%;align-items:center;justify-content:center;color:var(--muted2)}
.photo-area.no-img img{display:none!important}
.photo-area.no-img .offline-card{display:flex!important}
.photo-tag{position:absolute;bottom:8px;left:10px;max-width:calc(100% - 20px);background:rgba(0,0,0,.66);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:8px;padding:4px 8px;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.done-flag{position:absolute;top:10px;right:10px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:11px;letter-spacing:.4px;text-transform:uppercase;padding:4px 9px;border-radius:7px;display:none}
.excard.done .done-flag{display:block}
.ex-body{padding:14px 14px 4px}
.ex-name{font-size:17px;font-weight:700;line-height:1.25;margin-bottom:8px}
.ex-name .num{font-family:var(--head);color:var(--muted2);font-weight:600;margin-right:4px}
.ex-chips{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.chip{background:var(--card);border-radius:8px;padding:5px 9px;font-size:12px;font-weight:600;color:var(--muted)}
.chip b{color:var(--text)}
.chip.dl{color:var(--deload);background:var(--deload-dim)}
.prev{font-size:13px;color:var(--muted);line-height:1.45;margin-bottom:6px}
.prev b{color:var(--text);font-weight:700}
.hint{font-size:13px;line-height:1.4;font-weight:600;color:var(--accent-ink);background:var(--accent-dim);border-radius:10px;padding:8px 10px;margin:4px 0 8px}
.hint.dl{color:var(--deload);background:var(--deload-dim)}
.steps-tog{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;padding:10px 0;border-top:1px solid var(--line);margin-top:4px;user-select:none}
.sarr{font-size:12px;transition:transform .2s;display:inline-block}
.sarr.open{transform:rotate(90deg)}
.steps-body{display:none;padding:4px 0 6px}
.steps-body.open{display:block}
.step-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.step-row:last-child{border-bottom:none}
.step-n{width:22px;height:22px;border-radius:7px;background:var(--card);color:var(--text);font-family:var(--head);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.step-t{font-size:13px;color:var(--muted);line-height:1.55}
.step-err{font-size:12px;color:var(--warn);padding:8px 0 2px;display:flex;gap:6px;line-height:1.45}
.light .step-err{color:#9A5B00}
.inp-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 14px 4px}
.stepper{display:flex;align-items:center;background:var(--card);border-radius:14px;padding:4px;gap:2px}
.sbtn{width:44px;height:44px;border:none;background:var(--surface);border-radius:10px;color:var(--text);font-size:22px;font-weight:600;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.sbtn:active{opacity:.6}
.sval{flex:1;min-width:0;text-align:center}
.sval input{width:100%;background:transparent;border:none;color:var(--text);font-family:var(--head);font-size:22px;font-weight:600;text-align:center;padding:0;outline:none}
.sval small{display:block;font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.sets-row{padding:10px 14px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.set-btn{min-width:58px;height:52px;padding:0 6px;border-radius:12px;border:1.5px dashed var(--muted2);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--head);font-size:17px;font-weight:600;color:var(--muted);transition:transform .12s;line-height:1.05}
.set-btn small{font-family:-apple-system,Arial,sans-serif;font-size:10px;font-weight:700}
.set-btn.next{border:2px solid var(--accent-ink);background:var(--accent-dim);color:var(--accent-ink);cursor:pointer}
.set-btn.done{background:var(--accent);border:1.5px solid var(--accent);color:var(--on-accent);cursor:pointer}
.set-btn.done small{opacity:.75}
.set-btn:active{transform:scale(.92)}
.sets-lbl{font-size:12px;color:var(--muted);margin-left:2px}
.bot-bar{padding:10px 14px calc(var(--safe-bot) + 10px);background:var(--bg);border-top:1px solid var(--line);flex-shrink:0}
.prog-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:7px;gap:8px}
.prog-track{height:5px;background:var(--border);border-radius:3px}
.prog-fill{height:100%;border-radius:3px;background:var(--accent);transition:width .35s}
.fin-btn{width:100%;margin-top:10px;height:54px;border-radius:16px;border:none;background:var(--accent);color:var(--on-accent);font-family:var(--head);font-size:18px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;cursor:pointer;display:none}
.fin-btn.show{display:block}
.wake{color:var(--muted)}

/* REST PILL / TOAST */
.pill{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(var(--safe-bot) + 140px);z-index:150;background:var(--text);color:var(--bg);border-radius:30px;padding:12px 20px;font-weight:800;font-size:16px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap}
body:not(.in-day) .pill{bottom:calc(var(--safe-bot) + 88px)}
.pill.show{opacity:1;pointer-events:all;transform:translateX(-50%)}
.pill.end{background:var(--accent);color:var(--on-accent)}
.toast{position:fixed;left:16px;right:16px;top:calc(var(--safe-top) + 12px);z-index:300;background:var(--text);color:var(--bg);border-radius:16px;padding:14px 16px;font-weight:700;font-size:15px;box-shadow:0 8px 30px rgba(0,0,0,.35);transform:translateY(-150%);opacity:0;visibility:hidden;transition:transform .3s,opacity .3s,visibility 0s .3s;text-align:center}
.toast.show{transform:translateY(0);opacity:1;visibility:visible;transition:transform .3s,opacity .3s}

/* TIMER & SHEETS */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:200;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .28s}
.overlay.open{opacity:1;pointer-events:all}
.tsheet,.sheet{background:var(--surface);border-radius:26px 26px 0 0;width:100%;transform:translateY(100%);transition:transform .32s cubic-bezier(.4,0,.2,1)}
.tsheet{padding:20px 24px calc(var(--safe-bot) + 26px)}
.sheet{padding:16px 16px calc(var(--safe-bot) + 20px);max-height:86vh;overflow-y:auto}
.overlay.open .tsheet,.overlay.open .sheet{transform:translateY(0)}
.tdrag{width:34px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 18px}
.tlbl{text-align:center;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.tdisp{text-align:center;font-family:var(--head);font-size:104px;font-weight:600;line-height:1;transition:color .2s}
.tdisp.warn{color:var(--bad);animation:blink .5s infinite alternate}
.tdisp.green{color:var(--accent-ink)}
@keyframes blink{to{opacity:.4}}
.tsub{text-align:center;font-size:13px;color:var(--muted);margin:8px 0 18px;min-height:18px}
.tpresets{display:flex;gap:8px;justify-content:center;margin-bottom:18px}
.tpre{padding:9px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--card);font-size:14px;font-weight:700;cursor:pointer;color:var(--text)}
.tpre.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tctrls{display:flex;gap:14px;justify-content:center;align-items:center}
.tmain{width:78px;height:78px;border-radius:24px;border:none;font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--on-accent)}
.tmain:active{transform:scale(.92)}
.tside{width:58px;height:58px;border-radius:18px;border:1.5px solid var(--border);background:var(--card);color:var(--text);font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tclose{display:flex;gap:10px;margin-top:18px}
.tclose button{flex:1;padding:14px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:15px;font-weight:700}
.sheet h3{font-family:var(--head);font-size:24px;font-weight:700;text-transform:uppercase;margin:4px 4px 4px}
.sheet p.sub{font-size:13px;color:var(--muted);margin:0 4px 12px}

/* STATS */
.chart-wrap{position:relative}
.chart-wrap svg{display:block;width:100%;height:auto;overflow:visible}
.chart-cap{font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.4}
.chart-title{font-family:var(--head);font-size:22px;font-weight:600;margin-bottom:2px}
.tip{position:absolute;pointer-events:none;background:var(--text);color:var(--bg);font-size:12px;font-weight:700;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .12s;z-index:5;line-height:1.35}
.tip.show{opacity:1}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
select.exsel{width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:15px;font-family:inherit;margin-bottom:12px;-webkit-appearance:none;appearance:none}
.empty{font-size:13px;color:var(--muted);text-align:center;padding:24px 8px;line-height:1.5}
.hrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;gap:10px}
.hrow:last-child{border-bottom:none}
.hrow small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.hrow .r{text-align:right;white-space:nowrap}
.dlmark{font-size:10px;font-weight:800;color:var(--deload);background:var(--deload-dim);padding:2px 6px;border-radius:5px;margin-left:6px;vertical-align:1px}

/* FOOD */
.macro-row{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:6px;margin-top:12px}
.macro{background:var(--card);border-radius:12px;padding:10px 6px;text-align:center}
.macro b{display:block;font-family:var(--head);font-size:24px;font-weight:600;line-height:1.1}
.macro span{font-size:11px;color:var(--muted)}
.macro.k b{color:var(--accent-ink)}
.stage-chips{display:flex;gap:6px;margin-top:12px}
.stage-chip{flex:1;padding:10px 6px;border-radius:12px;border:1.5px solid var(--border);background:var(--card);text-align:center;cursor:pointer;font-size:12px;color:var(--muted);line-height:1.3}
.stage-chip b{display:block;font-family:var(--head);font-size:18px;font-weight:600;color:var(--text)}
.stage-chip.on{border-color:var(--accent);background:var(--accent)}
.stage-chip.on,.stage-chip.on b{color:var(--on-accent)}
.advice{margin-top:12px;padding:11px 12px;border-radius:12px;font-size:13px;line-height:1.45;background:var(--card)}
.advice.up{background:var(--accent-dim)}
.advice.down{background:rgba(255,184,60,.14)}
.advice button{margin-top:8px;border:none;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:13px;padding:10px 12px;border-radius:10px;cursor:pointer}
.meal{background:var(--surface);border:1px solid var(--border);border-radius:20px;margin:0 16px 10px;overflow:hidden;transition:border-color .2s}
.meal.ate{border-color:var(--accent)}
.meal-h{display:flex;align-items:center;gap:12px;padding:14px 14px 10px}
.meal-h h3{font-family:var(--head);font-size:20px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.meal-h p{font-size:12px;color:var(--muted);margin-top:1px}
.ate-btn{margin-left:auto;min-width:44px;height:44px;border-radius:12px;border:1.5px solid var(--border);background:var(--card);font-size:13px;font-weight:800;color:var(--muted);cursor:pointer;padding:0 12px;white-space:nowrap}
.meal.ate .ate-btn{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.fitem{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.fitem .fn{flex:1;min-width:0}
.fitem .fn b{font-size:14px;font-weight:700;display:block}
.fitem .fn span{font-size:12px;color:var(--muted)}
.fitem .fn i{font-style:normal;color:var(--accent-ink);font-size:11px;font-weight:700;margin-left:4px}
.fitem .fk{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.swb{width:40px;height:40px;border-radius:10px;border:none;background:var(--card);color:var(--text);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.swb svg.i{width:18px;height:18px}
.swb.ph{visibility:hidden}
.meal-note{font-size:12px;color:var(--muted);padding:0 14px 12px;margin-top:-4px}
.fnotes{margin:6px 16px 0;font-size:13px;color:var(--muted);line-height:1.6}
.fnotes b{color:var(--text)}
.alt{display:flex;align-items:center;gap:10px;padding:13px 12px;border-radius:14px;border:1.5px solid var(--border);margin-bottom:8px;cursor:pointer;background:var(--card)}
.alt.on{border-color:var(--accent-ink);background:var(--accent-dim)}
.alt .fn{flex:1}
.alt .fn b{font-size:15px;display:block}
.alt .fn span{font-size:12px;color:var(--muted)}
.alt .fk{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap;line-height:1.4}

/* BODY */
.wrow{display:flex;gap:8px;align-items:stretch;margin-top:12px}
.wrow .stepper{flex:1}
.wrow .sval input{font-size:26px}
.pbtn{border:none;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:15px;border-radius:14px;padding:0 16px;cursor:pointer;white-space:nowrap}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.mfield{background:var(--card);border-radius:12px;padding:8px 12px}
.mfield label{display:block;font-size:11px;color:var(--muted);font-weight:600}
.mfield input{width:100%;background:transparent;border:none;outline:none;color:var(--text);font-family:var(--head);font-size:22px;font-weight:600;padding:2px 0}
.mtable{width:100%;border-collapse:collapse;margin-top:4px;font-size:14px}
.mtable th{font-size:11px;color:var(--muted);font-weight:600;text-align:right;padding:8px 0;border-bottom:1px solid var(--line)}
.mtable th:first-child,.mtable td:first-child{text-align:left}
.mtable td{padding:10px 0;border-bottom:1px solid var(--line);text-align:right}
.mtable tr:last-child td{border-bottom:none}
.mtable td.d{color:var(--muted);font-size:13px}
.full-btn{width:100%;margin-top:12px;height:52px;border-radius:14px;border:none;background:var(--accent);color:var(--on-accent);font-size:15px;font-weight:800;cursor:pointer}
.ghost-btn{width:100%;margin-top:8px;padding:12px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer}
</style>
</head>

 ]}

const PHASES=[

];
const DELOAD_K=0.85;

// ─── DATE UTILS ─────────────────────────────────────────────────
const pad=n=>(n<10?'0':'')+n;
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date());
function parseD(s){const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);}
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
const MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
function fmtD(s){const d=parseD(s);return d.getDate()+' '+MON[d.getMonth()];}
function daysAgo(s){const n=Math.round((parseD(today())-parseD(s))/864e5);return n===0?'сегодня':n===1?'вчера':n+' дн. назад';}
function weekIdx(s){return Math.round((mondayOf(parseD(s))-mondayOf(parseD(ST.start)))/(7*864e5));}
function phaseOf(s){const i=((weekIdx(s)%4)+4)%4;return PHASES[i];}
const curPhase=()=>phaseOf(today());

// ─── HELPERS ────────────────────────────────────────────────────
function repRange(r){const m=(r.match(/\d+/g)||['10']).map(Number);return [m[0],m[m.length-1]];}
const rnd=x=>Math.round(x*2)/2;
const fmtW=w=>(Math.round(w*10)/10).toString().replace('.',',');
function setsFor(ex,ph){return ph.deload?Math.ceil(ex.sets/2):ex.sets;}
const dayById=id=>DAYS.find(d=>d.id===id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// cur[dayId] = {date, log:{exName:[{w,r}]}, inp:{exName:{w,r}}, done}

let ST={v:4,theme:'dark',start:null,wake:true,rest:90,cur:{},hist:[],seedW:{},tEnd:0};
const _m={};
function _get(k){try{return localStorage.getItem(k);}catch(e){return _m[k]||null;}}
function _set(k,v){try{localStorage.setItem(k,v);}catch(e){_m[k]=v;}}
function load(){
  try{
    const s=_get('wk4');
    if(s){Object.assign(ST,JSON.parse(s));}
    else{
      // миграция весов из прошлой версии
      const o=_get('wk3');
      if(o){const p=JSON.parse(o);ST.theme=p.theme||'dark';
        DAYS.forEach(d=>{const pd=p.days&&p.days[d.id];if(!pd)return;
          d.ss.forEach((ss,si)=>ss.ex.forEach((ex,ei)=>{const w=pd.weights&&pd.weights[si+'_'+ei];if(w>0)ST.seedW[ex.name]=w;}));});}
    }
  }catch(e){}
  if(!ST.start) ST.start=dstr(mondayOf(new Date()));
  if(!ST.food) ST.food={stage:1,sw:{},eat:{date:'',m:{}}};
  if(!ST.body) ST.body=seedBody();
}
function save(){try{_set('wk4',JSON.stringify(ST));}catch(e){}}

function sess(id){
  const t=today();let c=ST.cur[id];
  if(!c||c.date!==t){c=ST.cur[id]={date:t,log:{},inp:{},done:false};}
  return c;
}
function syncHist(id){
  const c=ST.cur[id];
  const has=Object.values(c.log).some(a=>a.length);
  const i=ST.hist.findIndex(h=>h.date===c.date&&h.day===id);
  if(!has){if(i>=0)ST.hist.splice(i,1);return;}
  const ph=phaseOf(c.date);
  const e={date:c.date,day:id,deload:!!ph.deload,wk:ph.n,done:!!c.done,ex:JSON.parse(JSON.stringify(c.log))};
  if(i>=0)ST.hist[i]=e;else ST.hist.push(e);
  ST.hist.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.day-b.day);
}
function prevSets(name,intensOnly){
  const t=today();
  for(let i=ST.hist.length-1;i>=0;i--){
    const h=ST.hist[i];if(h.date>=t)continue;if(intensOnly&&h.deload)continue;
    const a=h.ex[name];if(a&&a.length)return {date:h.date,sets:a,deload:h.deload};
  }
  return null;
}
function lastSessionAny(){return ST.hist.length?ST.hist[ST.hist.length-1]:null;}
function nextDayId(){const l=lastSessionAny();if(!l)return 1;
  // если последняя тренировка сегодня и не закончена — она и есть текущая
  if(l.date===today()&&!l.done)return l.day;
  return l.day%DAYS.length+1;}
function lastDateOf(id){for(let i=ST.hist.length-1;i>=0;i--)if(ST.hist[i].day===id)return ST.hist[i].date;return null;}

function defInp(ex,ph){
  const pI=prevSets(ex.name,true);
  const [lo]=repRange(ex.reps);
  let w=pI?Math.max(...pI.sets.map(s=>s.w)):(ST.seedW[ex.name]||0);
  let r=pI?pI.sets[0].r:lo;
  if(ph.deload){w=rnd(w*DELOAD_K);r=lo;}
  return {w,r};
}
function inpOf(id,ex){const c=sess(id);if(!c.inp[ex.name])c.inp[ex.name]=defInp(ex,phaseOf(c.date));return c.inp[ex.name];}

  const btns=Array.from({length:n},(_,i)=>{
    if(i<done)return `<div class="set-btn done" onclick="undoSet(${ei},${i})">${fmtW(log[i].w)}<small>×${log[i].r}</small></div>`;

      <div class="ex-name"><span class="num">${pad(ei+1)}</span>${esc(ex.name)}</div>
      <div class="ex-chips">
        <div class="chip${ph.deload?' dl':''}"><b>${n}</b> подх.</div>
        <div class="chip"><b>${ex.reps}</b> повт.</div>
        <div class="chip">в запасе <b>${ph.rir}</b></div>

      <div class="steps-body" id="sb_${ei}">
        ${ex.steps.map((s,i)=>`<div class="step-row"><div class="step-n">${i+1}</div><div class="step-t">${s}</div></div>`).join('')}
        ${ex.err?`<div class="step-err"><span><b>Важно:</b> ${ex.err}</span></div>`:''}
      </div>
    </div>
    ${full?'':`<div class="inp-row">
      <div class="stepper"><button class="sbtn" onclick="chg(${ei},'w',-2.5)">−</button>
        <div class="sval"><input inputmode="decimal" value="${fmtW(inp.w)}" onchange="setInp(${ei},'w',this.value)" onfocus="this.select()"><small>кг</small></div>
        <button class="sbtn" onclick="chg(${ei},'w',2.5)">+</button></div>
      <div class="stepper"><button class="sbtn" onclick="chg(${ei},'r',-1)">−</button>
        <div class="sval"><input inputmode="numeric" value="${inp.r}" onchange="setInp(${ei},'r',this.value)" onfocus="this.select()"><small>повт.</small></div>
        <button class="sbtn" onclick="chg(${ei},'r',1)">+</button></div>
    </div>`}

function logSet(ei){

  // взять значение из поля, если его меняли с клавиатуры без blur

  (c.log[ex.name]=c.log[ex.name]||[]).push({w:inp.w,r:inp.r});
  syncHist(curDay);save();updCard(ei);

function undoSet(ei,i){
  const ex=dayById(curDay).ex[ei],c=sess(curDay),log=c.log[ex.name]||[];
  if(i!==log.length-1){showToast('Отменить можно только последний подход');return;}

// ─── TIMER (переживает блокировку и перезапуск) ──────────────────
let T={dur:90,end:0,left:0,iv:null};   // end — момент окончания; left — остаток на паузе (мс)
let ACtx=null;
function unlockAudio(){try{if(!ACtx)ACtx=new(window.AudioContext||window.webkitAudioContext)();if(ACtx.state==='suspended')ACtx.resume();}catch(e){}}
function beep(){try{unlockAudio();const a=ACtx;[0,.25,.5].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.setValueAtTime(.3,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+.18);o.start(a.currentTime+t);o.stop(a.currentTime+t+.2);});}catch(e){}
  if(navigator.vibrate)navigator.vibrate([200,100,200]);}
const PRESETS=[60,90,120,180];
const fmtT=ms=>{const s=Math.ceil(ms/1000),m=Math.floor(s/60),x=s%60;return m+':'+pad(x);};
function remain(){return T.end?Math.max(0,T.end-Date.now()):T.left;}
function startRest(sec){
  T.dur=sec;T.end=Date.now()+sec*1000;T.left=0;ST.tEnd=T.end;save();
  if(!T.iv)T.iv=setInterval(tick,250);tick();
  document.getElementById('overlay').classList.add('open');
}
function tick(){
  const r=remain();
  const disp=document.getElementById('tdisp'),sub=document.getElementById('tsub'),play=document.getElementById('tplay');
  disp.textContent=fmtT(r);
  disp.className='tdisp'+(T.end&&r<=10000&&r>0?' warn':'');
  play.textContent=T.end?'⏸':'▶';
  sub.textContent=T.end?'Отдыхай…':(T.left?'Пауза':'');
  renderPresets();
  const pill=document.getElementById('pill');
  if(T.end||T.left){pill.className='pill'+(document.getElementById('overlay').classList.contains('open')?'':' show');pill.textContent='Отдых '+fmtT(r)+(T.left?' · пауза':'');}
  if(T.end&&r<=0)finishRest(Date.now()-T.end);
}
function finishRest(lateMs){
  T.end=0;T.left=0;ST.tEnd=0;save();clearInterval(T.iv);T.iv=null;
  beep();
  document.getElementById('tdisp').textContent='0:00';document.getElementById('tdisp').className='tdisp green';
  document.getElementById('tplay').textContent='▶';
  document.getElementById('tsub').textContent='Время вышло — следующий подход';
  const pill=document.getElementById('pill');pill.className='pill end show';pill.textContent='Отдых окончен — подход!';
  if(lateMs>3000)showToast('Отдых закончился '+fmtLate(lateMs)+' назад');
  setTimeout(()=>{if(!T.end&&!T.left)pill.className='pill';},8000);
}
function fmtLate(ms){const s=Math.round(ms/1000);return s<60?s+' сек':Math.floor(s/60)+' мин '+(s%60)+' сек';}
function togTimer(){
  unlockAudio();
  if(T.end){T.left=remain();T.end=0;ST.tEnd=0;}
  else{const ms=T.left||T.dur*1000;T.end=Date.now()+ms;T.left=0;ST.tEnd=T.end;if(!T.iv)T.iv=setInterval(tick,250);}
  save();tick();
}
function adjT(d){
  if(T.end){T.end=Math.max(Date.now()+5000,T.end+d*1000);ST.tEnd=T.end;}
  else if(T.left){T.left=Math.max(5000,T.left+d*1000);}
  else{T.dur=Math.max(5,T.dur+d);}
  save();tick();
}
function setPreset(s){ST.rest=s;T.dur=s;if(T.end){T.end=Date.now()+s*1000;ST.tEnd=T.end;}else if(T.left){T.left=s*1000;}save();tick();}
function renderPresets(){
  const cur=ST.rest;
  document.getElementById('tpresets').innerHTML=PRESETS.map(s=>`<div class="tpre${s===cur?' on':''}" onclick="setPreset(${s})">${s%60?Math.floor(s/60)+':'+pad(s%60):s/60+' мин'}</div>`).join('');
}
function openTimer(){unlockAudio();if(!T.end&&!T.left)T.dur=ST.rest;document.getElementById('overlay').classList.add('open');tick();}
function closeTimer(){document.getElementById('overlay').classList.remove('open');tick();}
function stopTimer(){T.end=0;T.left=0;ST.tEnd=0;save();clearInterval(T.iv);T.iv=null;document.getElementById('pill').className='pill';closeTimer();}
function overlayTap(e){if(e.target.id==='overlay')closeTimer();}
function pillTap(){if(T.end||T.left)openTimer();else document.getElementById('pill').className='pill';}
let toastT=null;
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),4000);}

document.addEventListener('visibilitychange',()=>{
  if(document.hidden)return;
  if(T.end)tick();              // если время вышло, пока экран был заблокирован — сразу сигнал
  if(curDay){const c=ST.cur[curDay];if(!c||c.date!==today())renderDay();wakeOn();}
});
document.addEventListener('pointerdown',unlockAudio,{once:true});

// ─── STATS ──────────────────────────────────────────────────────
let statsOpen=false,statEx=null;
function weeksData(n){
  const cw=weekIdx(today()),out=[];
  for(let w=cw-n+1;w<=cw;w++){
    const m=mondayOf(parseD(ST.start));m.setDate(m.getDate()+w*7);
    let sets=0,ses=0,dl=null;
    ST.hist.forEach(h=>{if(weekIdx(h.date)!==w)return;ses++;dl=h.deload;Object.values(h.ex).forEach(a=>sets+=a.length);});
    if(dl===null)dl=(((w%4)+4)%4)===3;
    out.push({w,label:m.getDate()+' '+MON[m.getMonth()],sets,ses,dl,cur:w===cw});
  }
  return out;
}
function barChart(data){
  const W=340,H=170,pl=28,pr=6,pt=14,pb=24,max=Math.max(10,...data.map(d=>d.sets));
  const top=Math.ceil(max/10)*10,bw=(W-pl-pr)/data.length,g=4;
  const y=v=>pt+(H-pt-pb)*(1-v/top);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Подходы по неделям">`;
  [0,top/2,top].forEach(v=>{s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`;});
  data.forEach((d,i)=>{
    const x=pl+i*bw+g/2,w=bw-g,h=Math.max(0,y(0)-y(d.sets));
    const fill=d.dl?'var(--deload)':'var(--chart)';
    if(d.sets>0)s+=`<path d="M${x},${y(0)} v${-(h-4)} q0,-4 4,-4 h${w-8} q4,0 4,4 v${h-4} z" fill="${fill}" opacity="${d.cur?1:.8}"/>`;
    s+=`<rect x="${pl+i*bw}" y="${pt}" width="${bw}" height="${H-pt}" fill="transparent" data-tip="${d.label}${d.dl?' · разгрузка':''}<br>${d.ses} трен. · ${d.sets} подх." data-x="${x+w/2}" data-y="${Math.min(y(d.sets),y(0)-4)}"/>`;
    if(i%2===data.length%2||d.cur)s+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="${d.cur?'var(--text)':'var(--muted)'}" font-weight="${d.cur?700:400}">${d.label}</text>`;
  });
  return s+'</svg>';
}
function lineChart(pts,opt){
  opt=opt||{};const st=opt.step||5,unit=opt.unit||'кг';
  const W=340,H=180,pl=34,pr=14,pt=18,pb=24;
  const ws=pts.map(p=>p.w),lo=Math.min(...ws),hi=Math.max(...ws);
  let a=Math.floor((lo-st/2)/st)*st,b=Math.ceil((hi+st/2)/st)*st;if(a<0)a=0;if(b===a)b=a+st;
  const x=i=>pts.length===1?(pl+W-pr)/2:pl+(W-pl-pr)*i/(pts.length-1);
  const y=v=>pt+(H-pt-pb)*(1-(v-a)/(b-a));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${opt.aria||'Рабочий вес по тренировкам'}">`;
  [a,(a+b)/2,b].forEach(v=>{s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${fmtW(v)}</text>`;});
  // линия только по интенсивным тренировкам, разгрузки — отдельные точки
  const ip=pts.map((p,i)=>({p,i})).filter(o=>!o.p.dl);
  if(ip.length>1)s+=`<polyline points="${ip.map(o=>x(o.i)+','+y(o.p.w)).join(' ')}" fill="none" stroke="var(--chart)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p,i)=>{
    s+=p.dl?`<circle cx="${x(i)}" cy="${y(p.w)}" r="4" fill="var(--surface)" stroke="var(--deload)" stroke-width="2"/>`
           :`<circle cx="${x(i)}" cy="${y(p.w)}" r="4.5" fill="var(--chart)" stroke="var(--surface)" stroke-width="2"/>`;
    s+=`<rect x="${x(i)-14}" y="${pt-10}" width="28" height="${H-pt}" fill="transparent" data-tip="${p.tip}" data-x="${x(i)}" data-y="${y(p.w)-6}"/>`;
  });
  // подпись — последний рабочий (интенсивный) вес
  const lo2=ip.length?ip[ip.length-1]:{p:pts[pts.length-1],i:pts.length-1};
  s+=`<text x="${x(lo2.i)}" y="${y(lo2.p.w)-12}" text-anchor="${lo2.i===0&&pts.length>1?'start':'end'}" font-size="12" font-weight="800" fill="var(--text)">${fmtW(lo2.p.w)} ${unit}</text>`;
  [0,pts.length-1].filter((v,i,arr)=>arr.indexOf(v)===i).forEach(i=>{s+=`<text x="${x(i)}" y="${H-6}" text-anchor="${i===0&&pts.length>1?'start':'end'}" font-size="10" fill="var(--muted)">${fmtD(pts[i].date)}</text>`;});
  return s+'</svg>';
}
function bindTips(wrap){
  const tip=wrap.querySelector('.tip'),svg=wrap.querySelector('svg');
  const show=e=>{const t=e.target.closest('[data-tip]');if(!t){tip.classList.remove('show');return;}
    const r=svg.getBoundingClientRect(),k=r.width/svg.viewBox.baseVal.width;
    tip.innerHTML=t.dataset.tip;tip.style.left=Math.min(Math.max(+t.dataset.x*k,60),r.width-60)+'px';tip.style.top=(+t.dataset.y*k)+'px';tip.classList.add('show');};
  svg.addEventListener('pointerdown',show);svg.addEventListener('pointermove',show);
  svg.addEventListener('pointerleave',()=>tip.classList.remove('show'));
}

  if(!statEx||!names.some(o=>o.ex.name===statEx))statEx=(withData[0]||names[0]).ex.name;

  const opts=DAYS.map(d=>`<optgroup label="День ${d.id} · ${esc(d.title)}">${d.ex.map(ex=>`<option${ex.name===statEx?' selected':''}>${esc(ex.name)}</option>`).join('')}</optgroup>`).join('');
  const recent=ST.hist.slice(-12).reverse();
  sc.innerHTML=`
    <div class="sec">Объём по неделям</div>
    <div class="panel">
      <div class="chart-title">Подходы за неделю</div>
      <div class="chart-cap">Последние 8 недель. Нажми на столбец — покажет детали.</div>
      <div class="chart-wrap">${barChart(wd)}<div class="tip"></div></div>
      <div class="legend"><span><i style="background:var(--chart)"></i>Интенсив</span><span><i style="background:var(--deload)"></i>Разгрузка</span></div>
    </div>
    <div class="sec">Рабочий вес</div>
    <div class="panel">
      <select class="exsel" onchange="statEx=this.value;renderStats()">${opts}</select>
      ${pts.length?`<div class="chart-cap">Максимальный вес за тренировку, кг. Пустые кружки — разгрузочные недели.</div>
      <div class="chart-wrap">${lineChart(pts)}<div class="tip"></div></div>`:'<div class="empty">По этому упражнению ещё нет записей.<br>Отметь подходы на тренировке — здесь появится график.</div>'}
    </div>
    <div class="sec">Последние тренировки</div>
    <div class="panel" style="padding:4px 16px">${recent.length?recent.map(h=>{const d=dayById(h.day);let n=0,t=0;Object.values(h.ex).forEach(a=>{n+=a.length;a.forEach(s=>t+=s.w*s.r);});
      return `<div class="hrow"><div>День ${h.day} · ${esc(d?d.title:'')}${h.deload?'<span class="dlmark">РАЗГР.</span>':''}<small>${fmtD(h.date)} · неделя ${h.wk||'–'}${h.done?'':' · не завершена'}</small></div><div class="r">${n} подх.<small>${fmtW(Math.round(t))} кг</small></div></div>`;}).join(''):'<div class="empty">Пока пусто — начни первую тренировку.</div>'}</div>
    <div class="foot"></div>`;
  sc.querySelectorAll('.chart-wrap').forEach(bindTips);
}

function mealsFor(stage){return [
  {id:'b',ic:'🍳',name:'Завтрак',items:[['oats',70],['milk',200],['egg',110],['banana',120]],note:'Овсянку вари на молоке'},
  {id:'l',ic:'🍚',name:'Обед',items:[['rice',90],['chicken',130],['veg',200],['oil',15]]},
  {id:'s',ic:'🥤',name:'Коктейль',items:SHAKES[stage-1],note:'В блендере. В день тренировки — сразу после зала'},
  {id:'d',ic:'🍽',name:'Ужин',items:[['buck',70],['chicken',120],['veg',200],['oil',10]]},
  {id:'e',ic:'🌙',name:'Вечер',items:[['skyr',250]],note:'За 1–2 часа до сна'},
];}
// равная калорийность при замене (овощи — тот же вес)
function eqGrams(fromKey,g,toKey){
  const a=FOOD[fromKey],b=FOOD[toKey];
  let x=a.g==='veg'?g:g*a.k/b.k;
  if(b.pc)return Math.max(1,Math.round(x/b.pc))*b.pc;
  return Math.max(5,Math.round(x/(x>200?10:5))*(x>200?10:5));
}
function resolveItem(mealId,key,g){
  const sk=mealId+'_'+key,alt=ST.food.sw[sk];
  if(alt&&FOOD[alt]&&alt!==key)return {key:alt,g:eqGrams(key,g,alt),orig:key,og:g,sk};
  return {key,g,orig:key,og:g,sk};
}
function macros(key,g){const f=FOOD[key],m=g/100;return {k:f.k*m,p:f.p*m,f:f.f*m,c:f.c*m};}
function fmtAmt(key,g){
  const f=FOOD[key];
  if(f.pc){const n=Math.round(g/f.pc);return n+' шт (≈'+g+' г)';}
  if(f.spoon&&g<=45){const sp=g/f.spoon;return (sp===1?'1 ст. л.':sp%1===0?sp+' ст. л.':Math.round(g/5)+' ч. л.')+' ('+g+' г)';}
  if(f.dry&&f.cook)return g+' г сухой → ~'+Math.round(g*f.cook/10)*10+' г готовой';
  if(f.dry)return g+' г сухой';
  return g+(f.ml?' мл':' г');
}
function dayTotals(stage){
  const t={k:0,p:0,f:0,c:0};
  mealsFor(stage).forEach(m=>m.items.forEach(([k,g])=>{const r=resolveItem(m.id,k,g),x=macros(r.key,r.g);for(const z in t)t[z]+=x[z];}));
  return t;
}
function eatToday(){const e=ST.food.eat;if(e.date!==today()){ST.food.eat={date:today(),m:{}};}return ST.food.eat.m;}

// ─── ВЕС: тренд и совет по калориям ─────────────────────────────
function seedBody(){
  // первая запись — данные от 4 ноября
  return {w:[{date:'2026-11-04',kg:72.5}],m:[{date:'2026-11-04',v:{sh:120,ch:106,bi:32,wa:87,gl:97,th:54,ca:37}}]};
}
const MEAS=[['sh','Плечи'],['ch','Грудь'],['bi','Бицепс'],['wa','Живот (талия)'],['gl','Ягодицы'],['th','Бедро'],['ca','Икра']];
function weightTrend(){
  const w=ST.body.w;if(w.length<2)return null;
  const last=w[w.length-1],lt=parseD(last.date);
  let ref=null;for(let i=w.length-2;i>=0;i--){if((lt-parseD(w[i].date))/864e5>=10){ref=w[i];break;}}
  if(!ref)return null;
  const days=(lt-parseD(ref.date))/864e5;
  return {rate:(last.kg-ref.kg)/days*7,days:Math.round(days),diff:last.kg-ref.kg};
}
function adviceHTML(){
  const tr=weightTrend(),st=ST.food.stage;
  if(!tr)return `<div class="advice">Взвешивайся раз в неделю утром натощак. Через 2 недели здесь появится совет, нужно ли менять калории. Цель — <b>+0,25–0,5 кг в неделю</b>.</div>`;
  const r=fmtW(Math.round(tr.rate*100)/100),d=(tr.diff>=0?'+':'')+fmtW(Math.round(tr.diff*10)/10);
  if(tr.rate<0.15){
    return `<div class="advice up">За ${tr.days} дн. вес ${d} кг (${r} кг/нед) — растёт слишком медленно. ${st<3?`Переходи на этап ${st+1}.<br><button onclick="setStage(${st+1})">Перейти на этап ${st+1}</button>`:'Добавь ещё ~200 ккал: +50 г сухой крупы в обед или второй коктейль.'}</div>`;
  }
  if(tr.rate>0.6){
    return `<div class="advice down">За ${tr.days} дн. вес ${d} кг (${r} кг/нед) — слишком быстро, часть уйдёт в жир. ${st>1?`Вернись на этап ${st-1}.<br><button onclick="setStage(${st-1})">Вернуться на этап ${st-1}</button>`:'Убери ~150 ккал: половину масла и банан на завтраке.'}</div>`;
  }
  return `<div class="advice up">За ${tr.days} дн. вес ${d} кг (${r} кг/нед) — отличный темп. Ничего не меняй.</div>`;
}
function setStage(n){ST.food.stage=Math.min(3,Math.max(1,n));save();renderFood();showToast('Этап питания: '+ST.food.stage);}

// ─── ЭКРАН ПИТАНИЯ ──────────────────────────────────────────────
let foodOpen=false,bodyOpen=false;
function renderFood(){
  const st=ST.food.stage,t=dayTotals(st),eat=eatToday(),meals=mealsFor(st);
  const nEat=meals.filter(m=>eat[m.id]).length;
  let h=`<div class="sec">Норма на день</div>
  <div class="panel">
    <div class="cyc-top"><div class="cyc-title">Этап ${st} · ${STAGES[st-1].name}</div><div class="cyc-tag">${nEat}/${meals.length} приёмов</div></div>
    <div class="macro-row">
      <div class="macro k"><b>${Math.round(t.k)}</b><span>ккал</span></div>
      <div class="macro"><b>${Math.round(t.p)}</b><span>белки, г</span></div>
      <div class="macro"><b>${Math.round(t.f)}</b><span>жиры, г</span></div>
      <div class="macro"><b>${Math.round(t.c)}</b><span>углев., г</span></div>
    </div>
    <div class="stage-chips">${STAGES.map(s=>{const tk=Math.round(dayTotals(s.n).k/10)*10;return `<div class="stage-chip${s.n===st?' on':''}" onclick="setStage(${s.n})"><b>${s.n}</b>~${tk} ккал</div>`;}).join('')}</div>
    <div class="cyc-tip" style="margin-top:10px">${STAGES[st-1].tip}</div>
    ${adviceHTML()}
  </div>
  <div class="sec">План на сегодня</div>`;
  meals.forEach(m=>{
    let mk=0;const rows=m.items.map(([k,g])=>{
      const r=resolveItem(m.id,k,g),x=macros(r.key,r.g);mk+=x.k;const f=FOOD[r.key];
      const can=f.g!=='powder';
      return `<div class="fitem"><div class="fn"><b>${f.n}${r.key!==r.orig?'<i>замена</i>':''}</b><span>${fmtAmt(r.key,r.g)}</span></div>
        <div class="fk">${Math.round(x.k)} ккал</div>
        <button class="swb${can?'':' ph'}" onclick="openSwap('${m.id}','${r.orig}',${r.og})" aria-label="Заменить продукт"><svg class="i"><use href="#i-swap"/></svg></button></div>`;
    }).join('');
    h+=`<div class="meal${eat[m.id]?' ate':''}">
      <div class="meal-h"><div><h3>${m.name}</h3><p>${Math.round(mk)} ккал</p></div>
      <button class="ate-btn" onclick="toggleAte('${m.id}')">${eat[m.id]?'✓ Съел':'Съел'}</button></div>
      ${m.note?`<div class="meal-note">${m.note}</div>`:''}${rows}</div>`;
  });
  h+=`<div class="fnotes">
    <b>Крупы</b> взвешивай в сухом виде, мясо и рыбу — в готовом.<br>
    <b>Вода:</b> 2–3 л в день, в день тренировки — больше.<br>
    <b>Кнопка со стрелками</b> — заменить продукт: вес пересчитается под те же калории.<br>
    Орехов в плане нет и в заменах тоже.
    ${Object.keys(ST.food.sw).length?'<br><button class="ghost-btn" onclick="resetSwaps()">Вернуть исходный план</button>':''}
  </div><div class="foot"></div>`;
  document.getElementById('food-scroll').innerHTML=h;
}
function toggleAte(id){const e=eatToday();e[id]=!e[id];save();renderFood();}
function resetSwaps(){if(!confirm('Убрать все замены продуктов?'))return;ST.food.sw={};save();renderFood();}
function openSwap(mealId,key,g){
  const grp=FOOD[key].g,cur=ST.food.sw[mealId+'_'+key]||key;
  const opts=Object.keys(FOOD).filter(k=>FOOD[k].g===grp);
  let h=`<h3>Заменить: ${FOOD[key].n}</h3><p class="sub">${GROUPS[grp]} · вес пересчитан под те же ${grp==='veg'?'граммы':'калории'}</p>`;
  opts.forEach(k=>{const gg=k===key?g:eqGrams(key,g,k),x=macros(k,gg);
    h+=`<div class="alt${k===cur?' on':''}" onclick="pickSwap('${mealId}','${key}','${k}')"><div class="fn"><b>${FOOD[k].n}${k===key?' · по плану':''}</b><span>${fmtAmt(k,gg)}</span></div>
    <div class="fk">${Math.round(x.k)} ккал<br>Б ${Math.round(x.p)} · Ж ${Math.round(x.f)} · У ${Math.round(x.c)}</div></div>`;});
  document.getElementById('sheet-body').innerHTML=h;
  document.getElementById('sheet-ov').classList.add('open');
}
function pickSwap(mealId,key,alt){const sk=mealId+'_'+key;if(alt===key)delete ST.food.sw[sk];else ST.food.sw[sk]=alt;save();closeSheet();renderFood();}
function closeSheet(){document.getElementById('sheet-ov').classList.remove('open');}

// ─── ЭКРАН ТЕЛА ─────────────────────────────────────────────────
let bodyW=null;
function lastW(){const w=ST.body.w;return w.length?w[w.length-1]:null;}
function lastM(){const m=ST.body.m;return m.length?m[m.length-1]:null;}
function renderBody(){
  const lw=lastW();if(bodyW===null)bodyW=lw?lw.kg:72;
  const pts=ST.body.w.map(e=>({date:e.date,w:e.kg,tip:fmtD(e.date)+'<br>'+fmtW(e.kg)+' кг'}));
  const lm=lastM(),fm=ST.body.m[0];
  const todayW=ST.body.w.find(e=>e.date===today());
  let h=`<div class="sec">Вес</div><div class="panel">
    <div class="chart-title">${lw?fmtW(lw.kg)+' кг':'Нет записей'}</div>
    <div class="chart-cap">${lw?'Последнее взвешивание: '+fmtD(lw.date)+' ('+daysAgo(lw.date)+')':'Взвесься утром натощак'}</div>
    ${pts.length>1?`<div class="chart-wrap">${lineChart(pts,{step:1,unit:'кг',aria:'Вес тела'})}<div class="tip"></div></div>`:''}
    <div class="wrow">
      <div class="stepper"><button class="sbtn" onclick="chgBW(-0.1)">−</button>
        <div class="sval"><input id="bw-inp" inputmode="decimal" value="${fmtW(bodyW)}" onchange="setBW(this.value)" onfocus="this.select()"><small>кг сегодня</small></div>
        <button class="sbtn" onclick="chgBW(0.1)">+</button></div>
      <button class="pbtn" onclick="saveBW()">${todayW?'Обновить':'Записать'}</button>
    </div>
    ${adviceHTML()}
  </div>
  <div class="sec">Замеры, см</div><div class="panel">`;
  if(lm){
    h+=`<div class="chart-cap">Последние: ${fmtD(lm.date)}${ST.body.m.length>1?' · изменение с '+fmtD(fm.date):''}</div>
    <table class="mtable"><tr><th>Параметр</th><th>Сейчас</th>${ST.body.m.length>1?'<th>Изменение</th>':''}</tr>
    ${MEAS.map(([k,l])=>{const v=lm.v[k],d=(v!=null&&fm.v[k]!=null)?Math.round((v-fm.v[k])*10)/10:null;
      return `<tr><td>${l}</td><td><b>${v!=null?fmtW(v):'—'}</b></td>${ST.body.m.length>1?`<td class="d">${d===null?'—':(d>0?'+':'')+fmtW(d)}</td>`:''}</tr>`;}).join('')}</table>`;
  }
  const mDue=!lm||(parseD(today())-parseD(lm.date))/864e5>=28;
  h+=`<div class="cyc-tip" style="margin-top:12px">Замеряй <b>раз в 4 недели</b> — удобно в разгрузочную неделю, утром, сантиметр без натяжения.</div>
    <button class="${mDue?'full-btn':'ghost-btn'}" onclick="openMeasForm()">Внести новые замеры</button>
  </div>`;
  if(ST.body.w.length){
    h+=`<div class="sec">История веса</div><div class="panel" style="padding:4px 16px">${ST.body.w.slice().reverse().slice(0,12).map(e=>
      `<div class="hrow" onclick="delBW('${e.date}')"><div>${fmtD(e.date)}<small>${daysAgo(e.date)}</small></div><div class="r">${fmtW(e.kg)} кг</div></div>`).join('')}</div>
    <div class="fnotes" style="text-align:center">Нажми на запись, чтобы удалить её</div>`;
  }
  h+='<div class="foot"></div>';
  const sc=document.getElementById('body-scroll');sc.innerHTML=h;
  sc.querySelectorAll('.chart-wrap').forEach(bindTips);
}
function chgBW(d){bodyW=Math.max(30,Math.round((bodyW+d)*10)/10);document.getElementById('bw-inp').value=fmtW(bodyW);}
function setBW(v){const x=parseFloat(String(v).replace(',','.'));if(!isNaN(x)&&x>30&&x<250)bodyW=Math.round(x*10)/10;document.getElementById('bw-inp').value=fmtW(bodyW);}
function saveBW(){
  setBW(document.getElementById('bw-inp').value);
  const w=ST.body.w,t=today(),e=w.find(x=>x.date===t);
  if(e)e.kg=bodyW;else w.push({date:t,kg:bodyW});
  w.sort((a,b)=>a.date<b.date?-1:1);save();renderBody();showToast('Записано: '+fmtW(bodyW)+' кг');
}
function delBW(d){if(!confirm('Удалить взвешивание '+fmtD(d)+'?'))return;ST.body.w=ST.body.w.filter(e=>e.date!==d);save();bodyW=null;renderBody();}
function openMeasForm(){
  const lm=lastM();
  let h=`<h3>Новые замеры</h3><p class="sub">${fmtD(today())} · в сантиметрах, подставлены прошлые значения</p><div class="mgrid">
    ${MEAS.map(([k,l])=>`<div class="mfield"><label>${l}</label><input id="m_${k}" inputmode="decimal" value="${lm&&lm.v[k]!=null?fmtW(lm.v[k]):''}" onfocus="this.select()"></div>`).join('')}</div>
    <button class="full-btn" onclick="saveMeas()">Сохранить замеры</button>
    <button class="ghost-btn" onclick="closeSheet()">Отмена</button>`;
  document.getElementById('sheet-body').innerHTML=h;
  document.getElementById('sheet-ov').classList.add('open');
}
function saveMeas(){
  const v={};MEAS.forEach(([k])=>{const x=parseFloat(document.getElementById('m_'+k).value.replace(',','.'));if(!isNaN(x)&&x>0)v[k]=Math.round(x*10)/10;});
  if(!Object.keys(v).length){alert('Заполни хотя бы одно поле');return;}
  const t=today(),m=ST.body.m,e=m.find(x=>x.date===t);
  if(e)e.v=v;else m.push({date:t,v});m.sort((a,b)=>a.date<b.date?-1:1);
  save();closeSheet();renderBody();showToast('Замеры сохранены');
}

// ─── BACKUP ─────────────────────────────────────────────────────
function exportData(){
  const blob=new Blob([JSON.stringify(ST,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='trenirovki-'+today()+'.json';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}
function importData(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const p=JSON.parse(r.result);if(!p||p.v!==4||!Array.isArray(p.hist))throw 0;
    if(!confirm('Заменить текущие данные копией ('+p.hist.length+' тренировок)?'))return;
    ST=Object.assign({v:4,theme:'dark',start:null,wake:true,rest:90,cur:{},hist:[],seedW:{},tEnd:0},p);
    if(!ST.food)ST.food={stage:1,sw:{},eat:{date:'',m:{}}};if(!ST.body)ST.body=seedBody();save();renderHome();showToast('Данные восстановлены');
  }catch(e){alert('Это не файл копии из приложения');}inp.value='';};
  r.readAsText(f);
}
function doReset(){
  if(!confirm('Удалить историю тренировок и рабочие веса? Питание, вес тела и замеры останутся. Это нельзя отменить.'))return;
  if(!confirm('Точно удалить? Советую сначала «Сохранить копию данных».'))return;
  const keep={theme:ST.theme,wake:ST.wake,rest:ST.rest,start:dstr(mondayOf(new Date())),food:ST.food,body:ST.body};
  ST=Object.assign({v:4,cur:{},hist:[],seedW:{},tEnd:0},keep);save();renderHome();
}

// ─── INIT ───────────────────────────────────────────────────────
load();
T.dur=ST.rest;
if(ST.tEnd){ // приложение перезапустилось во время отдыха
  if(ST.tEnd>Date.now()){T.end=ST.tEnd;T.iv=setInterval(tick,250);setTimeout(()=>{tick();closeTimer();},50);}
  else{const late=Date.now()-ST.tEnd;ST.tEnd=0;save();if(late<15*60000)setTimeout(()=>showToast('Отдых закончился '+fmtLate(late)+' назад'),400);}
}
renderHome();renderPresets();
</script>
</body>
</html>
